name: Generate snake game
on:
  schedule:
    - cron: "0 */12 * * *"  # every 12 hours, at minute 0
  workflow_dispatch:

jobs:
  build:
    name: Generate snake animation
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push to the output branch

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3  # correct action name and version
        with:
          github_user_name: franciellerl
          outputs: |
            dist/github-contribution-grid-snake2.svg?color_snake=$1B4332

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
